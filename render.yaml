# Hospedagem gratuita de testes: o banco é temporário.
# O servidor exige convite e mantém as campanhas separadas por navegador.
services:
  - type: web
    name: shinobi-testes
    runtime: node
    plan: free
    region: virginia
    branch: main
    numInstances: 1
    buildCommand: npm test
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_VERSION
        value: '24.22.1'
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: ./data/shinobi.sqlite
      - key: COOKIE_SECURE
        value: 'true'
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DAILY_LIMIT
        value: '100'
      - key: GEMINI_API_KEY
        sync: false
      - key: REQUIRE_INVITE
        value: 'true'
      - key: EPHEMERAL_STORAGE
        value: 'true'
      - key: OWNER_INVITE_HASH
        sync: false
      - key: ACCESS_SESSION_SECRET
        sync: false
